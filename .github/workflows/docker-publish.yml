name: docker-publish

# Manual deploy: this workflow builds and publishes images only. Deploying the
# new tag to Dokploy is a human action — see docker/README.md "Deploy" section.
# No `deploy` job here on purpose; don't add a Dokploy API call unless the
# team explicitly decides to switch to CI-triggered autodeploy.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/oral-test-backend
  SIDECAR_IMAGE: ${{ secrets.DOCKER_USERNAME }}/oral-test-tts-sidecar

jobs:
  validate:
    name: validate (lint, test, security scans)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # only this job uploads SARIF
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # Secret scan first, before any other step can echo something it finds.
      # Runs the OSS gitleaks CLI directly (Docker image) instead of the
      # gitleaks-action wrapper, which gates org usage behind a license.
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git \
            --report-format=sarif --report-path=/repo/gitleaks.sarif \
            --exit-code=1
      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3.27.0
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Self-contained (temp SQLite DB, stubbed TTS sidecar, no live `claude`
      # process) per src/test/e2e.ts's own header comment — always runnable in CI.
      - name: Test
        run: npm test

      # SCA: dependency vulnerabilities. Run via pip instead of an action to
      # avoid pinning yet another third-party Action for a tool this simple to
      # invoke directly.
      - name: SCA scan (Trivy filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Upload Trivy fs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3.27.0
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # SAST. Installed directly (pip) rather than via a third-party Action —
      # semgrep itself is the trust boundary either way, this just avoids an
      # extra Action to pin.
      #
      # No --error: the 15 findings surfaced when this step first ran for
      # real are all `security.audit.*` rules (low-confidence heuristics,
      # not confirmed vulnerabilities — e.g. an Express XSS rule matching
      # against Fastify route handlers). They're triaged via the Security
      # tab (SARIF upload below), not gated in CI, until reviewed individually.
      - name: SAST scan (Semgrep)
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config auto --sarif --output semgrep.sarif
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3.27.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  publish:
    name: publish (${{ matrix.service }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: Dockerfile
            image: oral-test-backend
          - service: tts-sidecar
            context: tts-sidecar
            dockerfile: tts-sidecar/Dockerfile
            image: oral-test-tts-sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.7.1

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and load locally first (push: false) so the container scan below
      # runs before the image ever reaches DockerHub — Shift-Left applies to
      # the build stage, not just source code.
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.9.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

      - name: Container scan (Trivy image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-image-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3.27.0
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      # Only reached if the container scan above passed. Two tags: the
      # immutable commit SHA (what rollback targets) and `latest` (convenience
      # pointer only) — never tag with just `latest`.
      - name: Push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.9.0
        continue-on-error: true
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

      - name: Retry push once on failure
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.9.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

      - name: Verify pushed image is pullable
        run: docker pull "${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}"
