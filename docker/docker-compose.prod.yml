# Dokploy deploy artifact. Dokploy only ever PULLS these images — it never
# builds from source (see docker/README.md, "Never build on the VPS").
# Always tracks `latest` (pull_policy: always) — clicking Deploy in Dokploy
# re-pulls whatever `main` last built. No SHA-pinned rollback lever; see
# docker/README.md's Rollback section for the manual alternative.
name: oral-test

services:
  backend:
    image: ${DOCKER_USERNAME}/oral-test-backend:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3008}:3001'
    # `claude` is logged into a Claude Pro session as root on the VPS host
    # (not API-key auth) — the container runs as root too so it can write the
    # session's refreshed tokens back to the bind-mounted files below. This
    # deliberately gives up the non-root `USER app` set in the Dockerfile; see
    # "`claude` CLI on the VPS" in docker/README.md for the tradeoff and the
    # non-root alternative (a dedicated host user + matching container UID).
    user: '0:0'
    environment:
      PORT: '3001'
      HOST: '0.0.0.0'
      HOME: '/root'
      TTS_SIDECAR_URL: 'http://tts-sidecar:8765'
      BRAINSTORM_ALLOWED_ORIGINS: '${BRAINSTORM_ALLOWED_ORIGINS}'
    volumes:
      - backend_data:/app/data
      # `claude` CLI binary, installed on the VPS host (`npm install -g
      # @anthropic-ai/claude-code`, system-wide), not baked into this image —
      # bind-mounted read-only at the SAME absolute path it lives at on the
      # host so /usr/local/bin/claude's symlink into
      # .../lib/node_modules/@anthropic-ai/claude-code resolves without any
      # rewriting. Confirm both paths on the VPS first: `which claude` and
      # `npm root -g`. See docker/README.md.
      - ${CLAUDE_CLI_BIN:-/usr/local/bin/claude}:/usr/local/bin/claude:ro
      - ${CLAUDE_CLI_LIB:-/usr/local/lib/node_modules/@anthropic-ai/claude-code}:/usr/local/lib/node_modules/@anthropic-ai/claude-code:ro
      # `claude login` session (Claude Pro plan, not an API key) — read-write:
      # the CLI refreshes tokens in these files as the session ages, a
      # read-only mount would silently break auth after the first refresh.
      - /root/.claude:/root/.claude
      - /root/.claude.json:/root/.claude.json
    depends_on:
      - tts-sidecar
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  tts-sidecar:
    image: ${DOCKER_USERNAME}/oral-test-tts-sidecar:latest
    pull_policy: always
    restart: unless-stopped
    # No published port — reachable only from `backend` over this compose's
    # internal network. Unauthenticated endpoint by design (see
    # tts-sidecar/README.md); this is the boundary that keeps it non-public.
    environment:
      PORT: '8765'
    volumes:
      - tts_model_cache:/home/app/.cache
    deploy:
      resources:
        limits:
          memory: ${SIDECAR_MEMORY_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  backend_data:
  tts_model_cache:
