# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Root task runner (https://taskfile.dev) for the Fastify backend and Python TTS sidecar.
# Install the `task` CLI once (brew/scoop/choco/npm), then:
#   task setup   # install dependencies, migrate SQLite, and ingest the bundled demo PDFs
#   task dev     # run both local services after setup
#
# Local PDF ingestion requires `pdftotext` from Poppler on PATH. Docker installs it in the seed
# image automatically; install it through your OS package manager before running `task setup`.

version: "3"

vars:
  SIDECAR_DIR: tts-sidecar
  VENV_REL: .pyenv-tts-sidecar
  # Task's interpreter is POSIX (mvdan/sh), not cmd.exe, so the backslashes in the Windows branch
  # are escape characters unless the expansion sits inside shell quotes. Unquoted, `\S` and `\p`
  # are consumed and the path collapses to `.pyenv-tts-sidecarScriptspython.exe`. Every use of
  # {{.VENV_PYTHON}} below must therefore be its own double-quoted shell word — YAML quoting is
  # not shell quoting.
  VENV_PYTHON: '{{if eq OS "windows"}}{{.VENV_REL}}\Scripts\python.exe{{else}}{{.VENV_REL}}/bin/python{{end}}'
  SYSTEM_PYTHON: '{{if eq OS "windows"}}python{{else}}python3{{end}}'
  VENV_REQUIREMENTS_MARKER: "{{.VENV_REL}}/.requirements-installed"

tasks:
  setup:
    desc: Install dependencies, prepare the TTS venv, migrate SQLite, and ingest demo chapters.
    deps: [backend:dependencies, venv]
    cmds:
      - task: init

  init:
    desc: Initialize the local SQLite database and ingest the bundled demo chapters.
    deps: [backend:dependencies]
    cmds:
      - task: seed

  seed:
    desc: Idempotently ingest the five bundled demo chapters into the configured SQLite database.
    deps: [backend:dependencies]
    preconditions:
      - sh: test -f assets/Software_Requirements_3rd_Edition.pdf
        msg: "Missing assets/Software_Requirements_3rd_Edition.pdf; restore the bundled demo assets before seeding."
      - sh: test -f assets/FOUNDATIONS_OF_SOFTWARE_TESTING_ISTQB_CE.pdf
        msg: "Missing assets/FOUNDATIONS_OF_SOFTWARE_TESTING_ISTQB_CE.pdf; restore the bundled demo assets before seeding."
      - sh: command -v pdftotext >/dev/null 2>&1
        msg: "pdftotext (Poppler) is required for local demo seeding; install Poppler and retry."
    cmds:
      - npm run ingest:demo -- --pdf-dir assets
      - npm run check:demo-seed -- --write-manifest

  check:seed-data:
    desc: Verify demo chunks and their source-PDF/registry manifest.
    deps: [backend:dependencies]
    cmds:
      - npm run check:demo-seed

  check:claude:
    desc: Verify that the local Claude CLI is installed, authenticated, and usable by the backend.
    deps: [backend:dependencies]
    cmds:
      - npm run check:claude-cli

  verify:
    desc: Run static checks, the regression suite, and the local demo-seed verification.
    deps: [backend:dependencies]
    cmds:
      - npm run typecheck
      - npm test
      - task: check:seed-data

  backend:dependencies:
    internal: true
    status:
      - test -f node_modules/.package-lock.json && test -d node_modules/fastify && test -d node_modules/@types/node && test node_modules/.package-lock.json -nt package-lock.json && test node_modules/.package-lock.json -nt package.json
    cmds:
      - npm ci

  venv:
    internal: true
    dir: "{{.SIDECAR_DIR}}"
    status:
      - test -f "{{.VENV_PYTHON}}" && test -f "{{.VENV_REQUIREMENTS_MARKER}}" && test "{{.VENV_REQUIREMENTS_MARKER}}" -nt requirements.txt
    cmds:
      - '"{{.SYSTEM_PYTHON}}" -m venv "{{.VENV_REL}}"'
      - '"{{.VENV_PYTHON}}" -m pip install -r requirements.txt'
      - '"{{.SYSTEM_PYTHON}}" -c "from pathlib import Path; Path(r\"{{.VENV_REQUIREMENTS_MARKER}}\").touch()"'

  dev:
    desc: Run the backend and the tts-sidecar together (Ctrl+C stops both).
    cmds:
      - task: check:seed-data
      - task --parallel dev:backend dev:tts-sidecar

  docker:up:
    desc: Build and run the API, TTS sidecar, and one-shot Docker seed service.
    cmds:
      - docker compose up --build --remove-orphans

  docker:down:
    desc: Stop Docker services while preserving the named runtime volumes.
    cmds:
      - docker compose down

  docker:logs:
    desc: Follow logs from Docker services.
    cmds:
      - docker compose logs --follow

  clear:
    desc: Clear local build artifacts, dependencies, and the TTS venv.
    cmds:
      - rm -rf node_modules
      - rm -rf "{{.SIDECAR_DIR}}/{{.VENV_REL}}"
      - rm -rf dist

  reset-data:
    desc: Delete the local SQLite database and generated seed manifest. This removes local sessions and reports.
    cmds:
      - rm -rf data

  dev:backend:
    internal: true
    cmds:
      - npm run dev

  dev:tts-sidecar:
    internal: true
    dir: "{{.SIDECAR_DIR}}"
    preconditions:
      - sh: test -f "{{.VENV_PYTHON}}"
        msg: "tts-sidecar venv not found — run `task setup` first."
    cmds:
      - '"{{.VENV_PYTHON}}" -m uvicorn app:app --host 127.0.0.1 --port 8765'
