server {
    listen 100.75.51.122:443 ssl;
    http2 on;
    server_name api.oraltest.site;

    ssl_certificate /etc/nginx/tls/api.oraltest.site.crt;
    ssl_certificate_key /etc/nginx/tls/api.oraltest.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:oraltest_tls:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
